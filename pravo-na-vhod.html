  // 04. ПРАВИЛА. Функции ниже пересчитывают партию из журнала решений.
  function initialProgress() {
    return {
      tokens: CONFIG.START_BUDGET,
      country: null, offer: null, fit: null, entry: null, dossier: null,
      access: null, governance: null, trust: null, supply: null, decision: null, finale: null,
      steps: []
    };
  }

  function reserveCost(progress) {
    if (progress.entry === "acquisition" && progress.trust) return PRICE.supply.acquiredCarrier;
    if (progress.country === "lindor" || progress.governance === "joint") return PRICE.supply.preparedRoute;
    return PRICE.supply.ordinaryRoute;
  }

  function complianceCost(progress) {
    const discount = progress.dossier === "market" ? PRICE.marketDossierDiscount : 0;
    return Math.max(0, PRICE.compliance[progress.entry] - discount);
  }

  function keepsTrust(progress, choice) {
    if (choice === "joint") return true;
    if (progress.country === "lindor") return choice === "central";
    if (progress.country === "marena") return choice === "autonomy";
    return choice === "ip" && progress.dossier === "team";
  }

  function getOptions(round, progress) {
    if (round.id === "R1") {
      return Object.entries(COUNTRIES).map(([id, country]) => ({
        id, title: country.name, mark: country.code, description: country.pitch, cost: 0, blocked: ""
      }));
    }

    return OPTIONS[round.id]
      .filter(({ id }) => id !== "ip" || progress.country === "severa")
      .map((option) => {
        const { id } = option;
        let { description } = option;
        let cost = 0;
        let blocked = "";

        switch (round.id) {
          case "R2":
            cost = PRICE.offer[id];
            break;
          case "R3":
            cost = PRICE.entry[id];
            if (id !== "export") description += " Местная компания — " + COUNTRIES[progress.country].object + ".";
            break;
          case "R4":
            if (id === "full") cost = complianceCost(progress);
            break;
          case "R5":
            cost = PRICE.governance[id];
            description = GOVERNANCE[id][progress.entry];
            if (id === "ip" && progress.dossier !== "team") blocked = "Требуется досье «Команда и культура».";
            break;
          case "R6":
            if (id === "reserve") cost = reserveCost(progress);
            if (id === "critical") cost = PRICE.supply.critical;
            break;
          case "R7":
            if (id === "scale") {
              cost = PRICE.scale;
              const needs = [];
              if (progress.access !== "full") needs.push("полный допуск");
              if (progress.supply !== "reserve") needs.push("полные поставки");
              if (needs.length) blocked = "Нужно выполнить условия: " + needs.join(" и ") + ".";
            }
            if (id === "pilot") {
              if (progress.access === "freeze") blocked = "Допуск приостановлен.";
              if (progress.supply === "stop") blocked += (blocked ? " " : "") + "Поставки остановлены.";
            }
            break;
        }

        if (cost > progress.tokens) {
          blocked += (blocked ? " " : "") + "Не хватает жетонов.";
        }
        return { ...option, description, cost, blocked };
      });
  }

  function finalCode(progress) {
    if (progress.decision === "scale") {
      const stable = progress.fit === 2 && progress.trust && progress.tokens >= 1;
      if (!stable) return "F3";
      return progress.entry === "acquisition" ? "F1" : "F2";
    }
    if (progress.decision === "pilot") {
      return progress.fit >= 1 && progress.trust && progress.tokens >= 1 ? "F4" : "F5";
    }
    return progress.tokens >= 2 ? "F6" : "F7";
  }

  function dossierImpact(countryId, dossierId) {
    if (dossierId === "market") {
      return "Снижает цену полного допуска в R4 на " + PRICE.marketDossierDiscount + " жет. Цена не может быть ниже нуля.";
    }
    if (countryId === "severa") return "В R5 становится доступна автономия с защитой интеллектуальной собственности.";
    return "Помогает обосновать, кому передать полномочия в R5.";
  }

  function applyChoice(progress, round, option, event) {
    const { id, cost, title } = option;
    const country = COUNTRIES[progress.country];
    let message;

    progress.tokens -= cost;
    switch (round.id) {
      case "R1":
        progress.country = id;
        message = "Рынок закреплён. Местная компания для альянса или покупки — " + COUNTRIES[id].object + ".";
        break;
      case "R2":
        progress.offer = id;
        progress.fit = FIT[progress.country][id];
        message = "Соответствие спросу — " + FIT_LABEL[progress.fit].toLowerCase() + " (" + progress.fit + " из 2). " + country.demand;
        break;
      case "R3":
        progress.entry = id;
        progress.dossier = event.dossier;
        message = option.description;
        if (event.dossier) {
          message += " Открыто досье «" + DOSSIERS[event.dossier].title + "». " + dossierImpact(progress.country, event.dossier);
        } else {
          message += " Досье не открыто.";
        }
        break;
      case "R4":
        progress.access = id;
        message = "Допуск — " + LABELS.access[id].toLowerCase() + ". " + option.description.split(". ")[0] + ".";
        if (id === "full" && progress.dossier === "market") message += " Учтена скидка за досье.";
        break;
      case "R5":
        progress.governance = id;
        progress.trust = keepsTrust(progress, id);
        message = "Доверие " + LABELS.trust[progress.trust].toLowerCase() + ". " + country.culture;
        if (progress.entry === "acquisition" && !progress.trust) message += " Есть риск потерять купленную компетенцию.";
        if (id === "joint") message += " Стороны согласовали порядок подключения резервного маршрута.";
        break;
      case "R6":
        progress.supply = id;
        message = "Поставки — " + LABELS.supply[id].toLowerCase() + ".";
        if (id === "reserve" && progress.access === "freeze") message += " Логистика готова к будущему запуску. Допуск остаётся приостановленным.";
        break;
      case "R7":
        progress.decision = id;
        progress.finale = finalCode(progress);
        message = "Решение совета зафиксировано. Итог рассчитан после списания жетонов за этот раунд.";
        break;
    }
    progress.steps.push({
      round: round.id, title, cost, message, remaining: progress.tokens,
      byDefault: event.byDefault, at: event.at
    });
  }

  function replay(history) {
    const progress = initialProgress();
    history.forEach((event, index) => {
      const round = ROUNDS[index];
      const option = getOptions(round, progress).find((choice) => choice.id === event.choice);
      if (!option || option.blocked) throw new Error("Недопустимое действие в " + round.id + ".");
      applyChoice(progress, round, option, event);
    });
    return progress;
  }

  function endingText(progress) {
    const base = FINALES[progress.finale].text;
    if (progress.finale !== "F2") return base;
    const entryText = progress.entry === "export"
      ? " Прямые продажи сохраняют обратимость, а выполнение требований компенсирует отсутствие своей инфраструктуры."
      : " Альянс открыл доступ к местной инфраструктуре, полномочия партнёра согласованы.";
    return base + entryText;
  }

  function endingSteps(progress) {
    const ids = progress.decision === "pause" ? ["R4", "R6", "R7"] : ["R2", "R5", "R6"];
    return progress.steps.filter((step) => ids.includes(step.round));
  }

  // 05. СОХРАНЕНИЕ. Один ключ localStorage на версию и команду.
  // Скачанные файлы попадают в папку загрузок, заданную в браузере.
  // Снимок состояния в JSON читаем для ведущего. При импорте итог вычисляется заново.
  const storagePrefix = CONFIG.STORAGE_PREFIX + ":" + CONFIG.VERSION;
  const activeTabKey = storagePrefix + ":active-team";
  const memory = new Map();
  let storageAvailable = true;

  function keyFor(team) {
    return storagePrefix + ":team:" + team;
  }

  function getStored(key) {
    if (storageAvailable) {
      try {
        const value = localStorage.getItem(key);
        if (value === null) memory.delete(key);
        else memory.set(key, value);
        return value;
      } catch {
        storageAvailable = false;
      }
    }
    return memory.get(key) ?? null;
  }

  function putStored(key, value) {
    if (value === null) memory.delete(key);
    else memory.set(key, value);
    if (!storageAvailable) return;
    try {
      if (value === null) localStorage.removeItem(key);
      else localStorage.setItem(key, value);
    } catch {
      storageAvailable = false;
    }
  }

  function activeTab(team) {
    try {
      if (team === undefined) return Number(sessionStorage.getItem(activeTabKey));
      if (team === null) sessionStorage.removeItem(activeTabKey);
      else sessionStorage.setItem(activeTabKey, String(team));
    } catch {
      return null;
    }
  }

  function tokenId() {
    return globalThis.crypto?.randomUUID?.() ?? Date.now().toString(36) + "-" + Math.random().toString(36).slice(2);
  }

  function freshRecord(team) {
    return {
      game: CONFIG.STORAGE_PREFIX, version: CONFIG.VERSION, team,
      session: tokenId(), revision: tokenId(), updatedAt: new Date().toISOString(),
      history: [], review: false, pendingDossier: null, notes: {}
    };
  }

  function noteKey(round, field) {
    return round + "." + field;
  }

  const allowedNotes = new Set(Object.entries(WORKSHEET).flatMap(([round, fields]) =>
    fields.map(([key]) => noteKey(round, key))
  ));

  function unpackRecord(value, expectedTeam) {
    if (!value || value.game !== CONFIG.STORAGE_PREFIX || value.version !== CONFIG.VERSION) {
      throw new Error("Этот файл относится к другой игре или версии сценария.");
    }
    if (!CONFIG.TEAMS.includes(value.team) || (expectedTeam && value.team !== expectedTeam)) {
      throw new Error("Номер команды в сохранении не совпадает.");
    }
    if (!Array.isArray(value.history) || value.history.length > ROUNDS.length ||
        typeof value.session !== "string" || !value.session || value.session.length > 100 ||
        typeof value.revision !== "string" || !value.revision || value.revision.length > 100 ||
        typeof value.review !== "boolean") {
      throw new Error("В сохранении повреждён журнал.");
    }

    const history = value.history.map((event, index) => {
      const round = ROUNDS[index];
      if (!event || event.round !== round.id || typeof event.choice !== "string" ||
          typeof event.byDefault !== "boolean" || typeof event.at !== "string" ||
          event.at.length > 32 || !Number.isFinite(Date.parse(event.at))) {
        throw new Error("Некорректная запись для " + round.id + ".");
      }
      const dossier = event.dossier ?? null;
      if (dossier !== null && (round.id !== "R3" || !Object.hasOwn(DOSSIERS, dossier))) {
        throw new Error("Досье сохранено в неверном раунде.");
      }
      if (event.byDefault && (event.choice !== round.default || dossier !== null)) {
        throw new Error("Неверный вариант по умолчанию в " + round.id + ".");
      }
      return { round: round.id, choice: event.choice, byDefault: event.byDefault, dossier, at: event.at };
    });

    if (value.review && (!history.length || history.length === ROUNDS.length)) {
      throw new Error("Сохранение указывает на неверный экран раунда.");
    }
    const pendingDossier = value.pendingDossier ?? null;
    if (pendingDossier !== null &&
        (history.length !== 2 || value.review || !Object.hasOwn(DOSSIERS, pendingDossier))) {
      throw new Error("В сохранении повреждено открытое досье.");
    }
    if (!value.notes || typeof value.notes !== "object" || Array.isArray(value.notes)) {
      throw new Error("В сохранении повреждён рабочий лист.");
    }
    const notes = {};
    for (const [key, text] of Object.entries(value.notes)) {
      if (allowedNotes.has(key) && typeof text === "string") notes[key] = text.slice(0, CONFIG.MAX_NOTE_LENGTH);
    }

    replay(history);
    return {
      game: CONFIG.STORAGE_PREFIX, version: CONFIG.VERSION, team: value.team,
      session: value.session, revision: value.revision,
      updatedAt: typeof value.updatedAt === "string" ? value.updatedAt.slice(0, 32) : "",
      history, review: value.review, pendingDossier, notes
    };
  }

  function slotFor(team) {
    const saved = getStored(keyFor(team));
    if (saved === null) return { saved, record: null, invalid: false };
    try {
      return { saved, record: unpackRecord(JSON.parse(saved), team), invalid: false };
    } catch {
      return { saved, record: null, invalid: true };
    }
  }

  function persist(record) {
    record.updatedAt = new Date().toISOString();
    putStored(keyFor(record.team), JSON.stringify(record));
    return record;
  }

  // Web Locks координирует две вкладки одного браузера. В любом браузере
  // перед фиксацией сверяем ревизию сохранения и снова проверяем доступность.
  function withTeamLock(team, change) {
    if (!storageAvailable || window.location?.protocol === "file:" || !navigator.locks?.request) {
      return Promise.resolve().then(change);
    }
    let entered = false;
    return navigator.locks.request(keyFor(team), () => {
      entered = true;
      return change();
    }).catch((error) => {
      if (entered || error.name !== "SecurityError") throw error;
      return change();
    });
  }

  function newRevision(record, patch) {
    return { ...record, ...patch, revision: tokenId() };
  }

  function snapshotOf(progress) {
    return {
      tokens: progress.tokens,
      country: progress.country, offer: progress.offer, fit: progress.fit,
      entry: progress.entry, dossier: progress.dossier, access: progress.access,
      governance: progress.governance, trust: progress.trust, supply: progress.supply,
      decision: progress.decision, finale: progress.finale
    };
  }

  function saveDownload(filename, body, mime) {
    const url = URL.createObjectURL(new Blob([body], { type: mime }));
    const link = document.createElement("a");
    link.href = url;
    link.download = filename;
    link.hidden = true;
    document.body.append(link);
    link.click();
    link.remove();
    window.setTimeout(() => URL.revokeObjectURL(url), 10000);
  }

  function numberTag(number) {
    return String(number).padStart(2, "0");
  }

  function exportName(record, extension) {
    const count = record.history.length;
    const place = count === ROUNDS.length ? "final" : count ? "R" + count : "start";
    return CONFIG.STORAGE_PREFIX + "-" + CONFIG.VERSION + "-team-" + numberTag(record.team) + "-" + place + "." + extension;
  }

  function factRows(progress) {
    const titleFor = (round, id) => OPTIONS[round].find((option) => option.id === id)?.title;
    return [
      ["Страна", COUNTRIES[progress.country]?.name],
      ["Предложение", titleFor("R2", progress.offer)],
      ["Спрос", progress.fit === null ? null : FIT_LABEL[progress.fit] + " · " + progress.fit + "/2"],
      ["Способ входа", titleFor("R3", progress.entry)],
      ["Досье", DOSSIERS[progress.dossier]?.title ?? (progress.entry ? "Не открыто" : null)],
      ["Допуск", LABELS.access[progress.access]],
      ["Управление", titleFor("R5", progress.governance)],
      ["Доверие", LABELS.trust[progress.trust]],
      ["Поставки", LABELS.supply[progress.supply]]
    ];
  }

  function textReport(record, progress) {
    const parts = [
      "«" + CASE.title + "» · Команда " + numberTag(record.team),
      "Сценарий " + record.version + " · Зафиксировано раундов: " + record.history.length + " из " + ROUNDS.length,
      "Жетоны: " + progress.tokens + " из " + CONFIG.START_BUDGET,
      ...factRows(progress).filter(([, value]) => value).map(([label, value]) => label + " — " + value)
    ];

    if (progress.finale) {
      const finale = FINALES[progress.finale];
      parts.push("", progress.finale + " · " + finale.title, endingText(progress), "", "Три решения для защиты");
      endingSteps(progress).forEach((step) => parts.push(step.round + " · " + step.title + " — " + step.message));
    }
    parts.push("", "Журнал решений");
    progress.steps.forEach((step) => {
      parts.push(step.round + " · " + step.title + (step.byDefault ? " (по умолчанию)" : ""));
      parts.push("Цена " + step.cost + " · Осталось " + step.remaining, step.message, "");
    });
    if (!progress.steps.length) parts.push("Решения ещё не зафиксированы.");
    if (record.pendingDossier) parts.push("Открыто в текущем раунде: «" + DOSSIERS[record.pendingDossier].title + "».");

    parts.push("", "Рабочий лист");
    let notesPresent = false;
    ROUNDS.forEach((round) => {
      const notes = WORKSHEET[round.id].flatMap(([key, label]) => {
        const value = record.notes[noteKey(round.id, key)]?.trim();
        return value ? [label + ": " + value] : [];
      });
      if (!notes.length) return;
      notesPresent = true;
      parts.push(round.id + " · " + round.title, ...notes, "");
    });
    if (!notesPresent) parts.push("Заметок пока нет.");
    if (progress.finale) parts.push("", "Вопрос для защиты", DEFENSE_QUESTION);
    return "\uFEFF" + parts.join("\r\n") + "\r\n";
  }

  // 06. ИНТЕРФЕЙС. Экраны и обработчики действий. Стили — в разделе 01.
  const root = document.getElementById("pravo-na-vhod");
  if (!root || root.dataset.pvReady) return;
  root.dataset.pvReady = "true";

  const ui = Object.fromEntries([...root.querySelectorAll("[data-pv]")].map((element) =>
    [element.dataset.pv, element]
  ));

    record: null, progress: null, team: CONFIG.TEAMS[0], choice: null, busy: false,
    notice: "", tone: "info"
  };

  root.setAttribute("aria-label", "Игра «" + CASE.title + "»");

  function escapeText(value) {
    return String(value ?? "").replace(/[&<>"']/g, (symbol) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[symbol]
    );
  }

  // Типографика применяется к готовым текстам игры. Ввод команды сохраняется как введён.
  function t(value) {
    const typeset = String(value ?? "")
      .replace(/(?<![\p{L}\p{N}])([а-яё]{1,2}) (?=[а-яё0-9«])/giu, "$1\u00a0")
      .replace(/№ (?=\d)/g, "№\u00a0")
      .replace(/(\d) (?=(?:мин|дней|дня|часов|жет\.|из \d)(?![\p{L}\p{N}]))/gu, "$1\u00a0")
      .replace(/ (?=—)/g, "\u00a0");
    return escapeText(typeset);
  }

  function action(label, id, style = "", value = "") {
    const modifier = style ? " pv-button--" + style : "";
    return `<button class="pv-button${modifier}" type="button" data-action="${id}" data-value="${escapeText(value)}">${t(label)}</button>`;
  }

  function downloadActions() {
    return action("Скачать JSON", "export-json") + action("Скачать сводку TXT", "export-txt");
  }

  function renderNotice() {
    const warning = storageAvailable ? "" : "Браузер не записывает данные в localStorage. Скачайте JSON перед закрытием страницы.";
    const message = [view.notice, warning].filter(Boolean).join(" ");
    ui.notice.hidden = !message;
    ui.notice.dataset.tone = warning ? "warning" : view.tone;
    ui.notice.textContent = message;
  }

  function announce(message = "", tone = "info") {
    view.notice = message;
    view.tone = tone;
    renderNotice();
  }

  function setBusy(busy) {
    view.busy = busy;
  }

  function hero() {

          <p>Бюджет — ${CONFIG.START_BUDGET}&nbsp;жет. ${t(CASE.coverText)}</p>

          </svg>
          <span class="pv-art-code pv-art-code--bottom pv-mono">А&nbsp;/ Б&nbsp;/ В&nbsp;↗ Три маршрута</span>

      <div class="pv-tape pv-mono" aria-label="3 рынка, 7 раундов, 2 кризиса">

  function slotStatus(slot) {
    if (slot.invalid) return "Ошибка чтения";
    if (!slot.record) return "Новая партия";
    const count = slot.record.history.length;
    if (count === ROUNDS.length) return "Партия завершена";
    return count ? "Сохранено " + count + " из " + ROUNDS.length : "Партия начата";
  }

  function enterLabel(slot) {
    if (slot.invalid) return "Начать заново";
    if (!slot.record) return "Начать игру";
    return slot.record.history.length === ROUNDS.length ? "Открыть итог" : "Продолжить игру";
  }

  function renderHome() {
    const slots = new Map(CONFIG.TEAMS.map((team) => [team, slotFor(team)]));
    const teams = CONFIG.TEAMS.map((team) => `<label class="pv-team">
      <input type="radio" name="pv-team" value="${team}" ${team === view.team ? "checked" : ""}>
      <span class="pv-team-card">
        <span class="pv-mono">Команда</span>
        <span class="pv-team-number">${numberTag(team)}<span class="pv-radio-mark" aria-hidden="true"></span></span>
        <span class="pv-team-status">${t(slotStatus(slots.get(team)))}</span>
      </span>
    </label>`).join("");

    return hero() + `<section class="pv-entry" aria-labelledby="pv-team-title">
      <div class="pv-section-head">
        <h2 id="pv-team-title" tabindex="-1">Выберите команду</h2>

        </fieldset>

          <div class="pv-actions">

            </button>
            ${action("Восстановить из JSON", "import")}
          </div>
          <p>У&nbsp;каждой команды своё сохранение. Для продолжения на&nbsp;другом устройстве загрузите файл JSON.</p>

  function stageHead(round, variant, title = round.title, label = "") {
    const caption = label || round.id + " / " + (round.event || round.short);
    return `<header class="pv-stage-head${variant ? " pv-stage-head--" + variant : ""}">
      <span class="pv-mono">${t(caption)}</span>
      <h2 id="pv-stage-title" tabindex="-1">${t(title)}</h2>

  function countryCards() {
    return `<div class="pv-country-grid">${Object.values(COUNTRIES).map((country) => `
      <article class="pv-country">

      </article>`).join("")}</div>`;

  function disclosure(label, content, open = false) {
    return `<details class="pv-summary"${open ? " open" : ""}>
      <summary>${t(label)}</summary><div class="pv-detail-body">${content}</div>
    </details>`;

  function workbookFields(round, record) {
    return `<div class="pv-fields">${WORKSHEET[round.id].map(([id, label, prompt]) => {
      const key = noteKey(round.id, id);
      return `<label class="pv-field">

  }

  function worksheet(round, record) {
    return disclosure("Рабочий лист команды", `<p>Запишите аргументы команды. Заметки сохраняются вместе с партией и входят в сводку.</p>${workbookFields(round, record)}`);
  }

  function dossierCard(record, progress) {

      return `<div class="pv-dossier" id="pv-open-dossier" tabindex="-1">

  function optionCard(option) {

    return `<label class="pv-choice">

  }

  function extraTask(round, progress) {
    if (round.id !== "R5") return "";
    if (progress.entry === "acquisition") return " Объясните модель интеграции по двум осям: автономия и стратегическая взаимозависимость.";
    if (progress.entry === "alliance") return " Опишите полномочия сторон альянса.";
    return " Объясните, как штаб будет контролировать подрядчика.";
  }

  function choiceHint(option, tokens) {
    if (!option) return "Выберите вариант, чтобы увидеть расход и остаток жетонов.";
    return `Расход: ${option.cost}\u00a0жет. Остаток после фиксации: ${tokens - option.cost}\u00a0жет.`;
  }

  function roundScreen(round, record, progress) {
    const options = getOptions(round, progress);
    const selected = options.find((option) => option.id === view.choice && !option.blocked);
    const defaultTitle = options.find(({ id }) => id === round.default).title;
    const intro = round.event
      ? `<div class="pv-event"><p class="pv-mono">Сводка для совета</p><p>${t(round.intro)}</p></div>`
      : `<div class="pv-intro"><p>${t(round.intro)}</p></div>`;
    return stageHead(round, round.event ? "event" : "") + `<div class="pv-stage-body">
      ${intro}
      <div class="pv-task"><strong>Что обсудить · ${t(round.model)}</strong><p>${t(round.task + extraTask(round, progress))}</p></div>
      ${round.timing ? disclosure("Как распределить время", `<p>${t(round.timing)}</p>`) : ""}
      ${round.id === "R1" ? disclosure("Исходные данные «Контура»",
        `<p>${t(CASE.company)}</p><p>${t(CASE.startingPoint)}</p><p>${t(CASE.brief)}</p>`) +
        disclosure("Сравнить три страны", countryCards()) : ""}
      ${round.id === "R3" ? dossierCard(record, progress) : ""}
      ${worksheet(round, record)}
      <fieldset class="pv-choices">
        <legend>Решение команды</legend>
        ${options.map(optionCard).join("")}
      </fieldset>
      <div class="pv-commit pv-commit--decision">
        <p id="pv-choice-hint" role="status">${escapeText(choiceHint(selected, progress.tokens))}</p>
        <button class="pv-button pv-button--primary" type="button" data-action="commit" id="pv-commit-button" aria-describedby="pv-choice-hint" ${selected ? "" : "disabled"}>
          Зафиксировать решение <span class="pv-glyph" aria-hidden="true">↗</span>
        </button>
      </div>
      ${disclosure("Действие ведущего, если время вышло",
        `<p>Вариант по&nbsp;умолчанию — ${t(defaultTitle)}${round.id === "R3" ? " без досье" : ""}.</p>
          <p>${action("Применить вариант по умолчанию", "default")}</p>`)}
    </div>`;
  }

  function reviewScreen(round, record, progress) {
    const step = progress.steps.at(-1);
    const checkpoint = round.id === "R4";
    return stageHead(round, "review", "Решение зафиксировано", round.id + " / Последствия") +
      `<div class="pv-stage-body">
        <div class="pv-record">
          <span class="pv-mono">Цена ${step.cost} · Осталось ${step.remaining}${step.byDefault ? " · По умолчанию" : ""}</span>
          <h3>${t(step.title)}</h3>
          <p>${t(step.message)}</p>
        </div>
        ${checkpoint ? `<div class="pv-record pv-checkpoint">
          <span class="pv-mono">Контрольная точка&nbsp;/ Семинар 1</span>
          <h3>Сохраните партию перед семинаром 2</h3>
          <p>JSON нужен для продолжения игры на&nbsp;другом устройстве. TXT&nbsp;— сводка для ведущего.</p>
          <div class="pv-actions">${downloadActions()}</div>
        </div>` : ""}
        ${worksheet(round, record)}
        <div class="pv-commit">
          ${action(checkpoint ? "Перейти к семинару 2" : "Следующий раунд", "next", "primary")}
          <p>Откройте следующий раунд по&nbsp;сигналу ведущего.</p>
        </div>
      </div>`;
  }

  function logList(steps, explain = false) {
    if (!steps.length) return "<p>Решения ещё не зафиксированы.</p>";
    return `<ol class="pv-log${explain ? " pv-final-log" : ""}">
      ${steps.map((step) => `<li>
        <span class="pv-mono">${step.round}${step.byDefault ? " · По умолчанию" : ""}</span>
        <p><strong>${t(step.title)}</strong></p>
        <p>Цена ${step.cost}&nbsp;· Осталось ${step.remaining}</p>
        <p>${t(step.message)}</p>
      </li>`).join("")}
    </ol>`;
  }

  function finalScreen(record, progress) {
    const finale = FINALES[progress.finale];
    const country = COUNTRIES[progress.country].name;
    const entry = OPTIONS.R3.find(({ id }) => id === progress.entry).title;
    const recommendation = OPTIONS.R7.find(({ id }) => id === progress.decision).title;
    return stageHead(ROUNDS.at(-1), "final", finale.title, "Итог маршрута / " + progress.finale) +
      `<div class="pv-stage-body">
        <div class="pv-intro"><p><strong>Рекомендация совета — ${t(recommendation.toLowerCase())}.</strong></p><p>${t(endingText(progress))}</p></div>
        <dl class="pv-result-metrics">
          <div><dt>Рынок</dt><dd>${t(country)}</dd></div>
          <div><dt>Способ входа</dt><dd>${t(entry)}</dd></div>
          <div><dt>Остаток</dt><dd>${progress.tokens} из&nbsp;${CONFIG.START_BUDGET}&nbsp;жет.</dd></div>
        </dl>
        <div class="pv-intro"><h3>Три решения, которые объясняют итог</h3></div>
        ${logList(endingSteps(progress), true)}
        <div class="pv-task"><strong>Вопрос для защиты · 2&nbsp;мин</strong><p>${t(DEFENSE_QUESTION)}</p></div>
        ${disclosure("Рабочий лист · все раунды", ROUNDS.map((round) =>
          disclosure(round.id + " · " + round.short, workbookFields(round, record))
        ).join(""))}
        <div class="pv-commit"><div class="pv-actions">${downloadActions()}</div><p>Игровой итог фиксирует последствия. Учебную оценку выставляет ведущий.</p></div>
      </div>`;
  }

  function sidebar(record, progress) {
    const facts = factRows(progress).map(([label, value]) =>
      `<div><dt>${t(label)}</dt><dd>${value ? t(value) : "—"}</dd></div>`
    ).join("");
    return `<aside class="pv-sidebar" aria-label="Состояние игры">
      <section class="pv-sidebar-card">
        <h3>Состояние маршрута</h3>
        <dl class="pv-facts">${facts}</dl>
        ${disclosure("Журнал · " + record.history.length + " из " + ROUNDS.length, logList(progress.steps))}
      </section>
      <section class="pv-sidebar-card">
        <h3>Сохранение</h3>
        <div class="pv-actions">${downloadActions()}${action("Загрузить JSON", "import")}</div>
        <p class="pv-subtle">Журнал и&nbsp;заметки сохраняются в&nbsp;этом браузере. Для переноса партии скачайте JSON.</p>
        <div class="pv-actions">${action("Сбросить команду", "reset", "text")}</div>
      </section>
    </aside>`;
  }

  function renderGame() {
    const { record, progress } = view;
    const complete = Boolean(progress.finale);
    const count = record.history.length;
    const activeIndex = record.review ? count - 1 : count;
    const round = ROUNDS[activeIndex];
    const status = complete ? "Все решения зафиксированы"
      : "Раунд " + (activeIndex + 1) + " из " + ROUNDS.length + " · " + round.minutes + " мин";
    const steps = ROUNDS.map((item, index) => {
      const current = index === activeIndex;
      const done = index < count;
      return `<li${current ? ' aria-current="step"' : ""}${done ? ' class="pv-step-done"' : ""}>
        <span class="pv-mono">${item.id}${done ? '<span aria-hidden="true"> ✓</span><span class="pv-visually-hidden"> завершён</span>' : ""}</span>
        <span class="pv-step-name">${t(item.short)}</span>
      </li>`;
    }).join("");
    const stage = complete ? finalScreen(record, progress)
      : record.review ? reviewScreen(round, record, progress) : roundScreen(round, record, progress);
    return `<div class="pv-board">
      <div class="pv-board-head">
        <div>
          <span class="pv-mono pv-subtle">${complete ? "Финал" : "Семинар " + numberTag(round.seminar)} / Совет директоров</span>
          <h1 class="pv-board-title">Команда ${numberTag(record.team)}</h1>
          <p>${t(status)}</p>
        </div>
        <div class="pv-budget" aria-label="Осталось ${progress.tokens} жетонов из ${CONFIG.START_BUDGET}">
          <strong aria-hidden="true">${progress.tokens}</strong><span class="pv-mono" aria-hidden="true">жетонов<br>из&nbsp;${CONFIG.START_BUDGET}</span>
        </div>
      </div>
      <ol class="pv-progress" aria-label="Раунды">${steps}</ol>
      <div class="pv-layout">
        <section class="pv-stage" aria-labelledby="pv-stage-title">${stage}</section>
        ${sidebar(record, progress)}
      </div>
    </div>`;
  }

  function render(focus) {
    ui["home-button"].hidden = !view.record;
    ui.screen.innerHTML = view.record ? renderGame() : renderHome();
    renderNotice();
    if (!focus) return;
    const target = root.querySelector(focus);
    if (!target) return;
    target.focus({ preventScroll: true });
    const area = focus === "#pv-stage-title" ? target.closest(".pv-board") : target;
    area.scrollIntoView({ block: "start", behavior: "instant" });
  }

  function openMaterials() {
    const schedule = SCHEDULE.map((seminar, index) => `<div>
      <h3>Семинар ${index + 1}</h3><ol class="pv-schedule">${seminar.map(([time, label]) =>
        `<li><span class="pv-mono">${time}</span><span>${t(label)}</span></li>`
      ).join("")}</ol>
    </div>`).join("");
    ui["materials-body"].innerHTML = `<p><strong>Компания «Контур»</strong></p>
      <p>${t(CASE.company)}</p><p>${t(CASE.startingPoint)}</p><p>${t(CASE.brief)}</p>
      ${disclosure("Карточки стран и местных компаний", countryCards())}
      ${disclosure("Как играть", `<ul>
        <li>Каждая команда управляет «Контуром» в своей версии событий. Стартовый бюджет — ${CONFIG.START_BUDGET}&nbsp;жетонов.</li>
        <li>Сначала обсудите задачу, затем выберите вариант и зафиксируйте решение. Жетоны списываются при фиксации. Переходите дальше по сигналу ведущего.</li>
        <li>Заметки можно вести в рабочем листе. В конце первого семинара скачайте JSON и сводку TXT.</li>
        <li>После R7 подготовьте двухминутную защиту. Учебная оценка выставляется отдельно от игрового финала.</li>
      </ul>`, true)}
      ${disclosure("Пять ролей в команде", `<ul>${ROLES.map((role) => `<li>${t(role)}</li>`).join("")}</ul><p>Перед выбором каждый даёт рекомендацию. При разногласии проголосуйте и запишите оговорку меньшинства.</p>`)}
      ${disclosure("Расписание двух семинаров", `<div class="pv-two-cols">${schedule}</div>`)}
      ${disclosure("Памятка ведущим", `<p>Председатель объявляет этапы и держит общий таймер. Оператор проверяет фиксацию и резервные копии. Эксперт собирает рабочие листы и оценивает защиту.</p>
        <p>Последние две минуты раунда отведите на фиксацию. После дедлайна используйте вариант по умолчанию в карточке раунда. Кризисы объявляйте всем командам одновременно.</p>
        <ul>${RUBRIC.map(([weight, item]) => `<li><strong>${weight}</strong> · ${t(item)}</li>`).join("")}</ul>
        <p>Шкала по блоку — 0% за отсутствие ответа, 50% за частичное применение, 75% за факты и вывод, 100% за сравнение с альтернативой и связь с действием. Итог округлите до целого.</p>`)}
      ${disclosure("Где лежат сохранения", `<p>В панели разработчика браузера откройте «Приложение» → Local Storage → адрес страницы. Ключи этой версии:</p>
        <ul>${CONFIG.TEAMS.map((team) => `<li><code>${escapeText(keyFor(team))}</code></li>`).join("")}</ul>
        <p>JSON и TXT скачиваются в папку, указанную в браузере. Для восстановления на другом устройстве загрузите JSON той же версии.</p>`)}`;
    ui.materials.showModal();
  }

  function confirmAction(title, text, yes) {
    ui["confirm-title"].textContent = title;
    ui["confirm-text"].textContent = text;
    ui["confirm-yes"].textContent = yes;
    ui.confirm.returnValue = "cancel";
    return new Promise((resolve) => {
      ui.confirm.addEventListener("close", () => resolve(ui.confirm.returnValue === "confirm"), { once: true });
      ui.confirm.showModal();
    });
  }

  function showRecord(record, message = "", { focus = "#pv-stage-title", preserveChoice = false } = {}) {
    view.team = record.team;
    view.record = record;
    view.progress = replay(record.history);
    if (!preserveChoice) view.choice = null;
    activeTab(record.team);
    announce(message);
    render(focus);
  }

  function showHome(message = "", focus = "#pv-team-title") {
    view.record = null;
    view.progress = null;
    view.choice = null;
    activeTab(null);
    announce(message);
    render(focus);
  }

  async function enterTeam() {
    const team = view.team;
    const before = slotFor(team);
    if (before.invalid) {
      const allowed = await confirmAction("Начать заново?", "Старое сохранение не удалось прочитать. Новая партия заменит его.", "Начать заново");
      if (!allowed) return;
    }
    const record = await withTeamLock(team, () => {
      const latest = slotFor(team);
      if (latest.record) return latest.record;
      if (latest.invalid && latest.saved !== before.saved) throw new Error("Сохранение изменилось. Выберите команду ещё раз.");
      return persist(freshRecord(team));
    });
    showRecord(record);
  }

  async function mutateGame(expected, change, options) {
    await noteWrites;
    const { record, conflict } = await withTeamLock(expected.team, () => {
      const latest = slotFor(expected.team).record;
      if (!latest || latest.revision !== expected.revision || latest.session !== expected.session) {
        return { record: latest, conflict: true };
      }
      const next = change(latest, replay(latest.history));
      return { record: persist(next), conflict: false };
    });
    if (conflict) {
      const message = "Сохранение изменилось в другой вкладке. Проверьте актуальный этап перед повторным действием.";
      if (record) showRecord(record, message);
      else showHome(message);
      return;
    }
    showRecord(record, "", options);
  }

  function canChoose(record) {
    return record && !record.review && record.history.length < ROUNDS.length;
  }

  async function openDossier(id) {
    const record = view.record;
    if (!canChoose(record) || ROUNDS[record.history.length].id !== "R3" ||
        record.pendingDossier || !Object.hasOwn(DOSSIERS, id)) return;
    await mutateGame(record, (latest) => newRevision(latest, { pendingDossier: id }),
      { focus: "#pv-open-dossier", preserveChoice: true });
  }

  async function commit(byDefault = false) {
    const expected = view.record;
    if (!canChoose(expected)) return;
    const index = expected.history.length;
    const round = ROUNDS[index];
    const choice = byDefault ? round.default : view.choice;
    if (!choice) return;

    if (byDefault) {
      const text = "Ведущий применяет этот вариант после окончания времени. Решение попадёт в журнал.";
      if (!(await confirmAction("Время раунда вышло?", text, "Зафиксировать"))) return;
    }

    await mutateGame(expected, (latest, progress) => {
      const option = getOptions(round, progress).find((item) => item.id === choice);
      if (!option || option.blocked) throw new Error(option?.blocked || "Этот вариант недоступен.");
      const event = {
        round: round.id, choice, byDefault,
        dossier: round.id === "R3" && !byDefault ? latest.pendingDossier : null,
        at: new Date().toISOString()
      };
      return newRevision(latest, {
        history: [...latest.history, event], pendingDossier: null,
        review: index + 1 < ROUNDS.length
      });
    });
  }

  async function nextRound() {
    const expected = view.record;
    if (!expected?.review) return;
    await mutateGame(expected, (latest) => newRevision(latest, { review: false }));
  }

  async function resetTeam() {
    const expected = view.record;
    if (!expected) return;
    const title = "Сбросить команду " + numberTag(expected.team) + "?";
    const allowed = await confirmAction(title, "Локальный журнал и заметки этой команды будут удалены. Скачанные файлы сохранятся.", "Сбросить команду");
    if (!allowed) return;
    await noteWrites;
    await withTeamLock(expected.team, () => {
      const latest = slotFor(expected.team).record;
      if (!latest || latest.session !== expected.session || latest.revision !== expected.revision) {
        throw new Error("Партия уже изменилась. Проверьте состояние команды.");
      }
      putStored(keyFor(expected.team), null);
    });
    showHome("Команда " + numberTag(expected.team) + " готова к новой партии.");
  }

  function queueNote(input) {
    const source = view.record;
    const key = input.dataset.note;
    if (!source || !allowedNotes.has(key)) return;
    const text = input.value.slice(0, CONFIG.MAX_NOTE_LENGTH);
    source.notes[key] = text;
    noteWrites = noteWrites.then(() => withTeamLock(source.team, () => {
      const latest = slotFor(source.team).record;
      if (!latest || latest.session !== source.session) return;
      persist({ ...latest, notes: { ...latest.notes, [key]: text } });
      renderNotice();
    })).catch(() => announce("Не удалось записать заметку. Проверьте сохранение команды.", "warning"));
  }

  async function importFile(file) {
    if (file.size > CONFIG.MAX_IMPORT_BYTES) throw new Error("Файл слишком большой для сохранения игры.");
    const text = await file.text();
    let parsed;
    try {
      parsed = JSON.parse(text.replace(/^\uFEFF/, ""));
    } catch {
      throw new Error("Не удалось прочитать JSON. Выберите файл, скачанный из игры.");
    }
    const imported = unpackRecord(parsed);
    await noteWrites;
    const before = slotFor(imported.team);
    if (before.saved !== null) {
      const title = "Заменить сохранение команды " + numberTag(imported.team) + "?";
      const message = "Из файла будут загружены решения (" + imported.history.length + " из " + ROUNDS.length + ") и заметки. Сохранения других команд сохранятся.";
      if (!(await confirmAction(title, message, "Загрузить сохранение"))) return;
    }
    const record = await withTeamLock(imported.team, () => {
      if (slotFor(imported.team).saved !== before.saved) throw new Error("Сохранение изменилось. Выберите файл повторно.");
      return persist(newRevision(imported, { session: tokenId() }));
    });
    showRecord(record, "Партия команды " + numberTag(record.team) + " восстановлена из JSON.");
  }

  async function download(format) {
    const current = view.record;
    if (!current) return;
    await noteWrites;
    const saved = slotFor(current.team).record;
    if (!saved || saved.session !== current.session) {
      throw new Error("Партия изменилась в другой вкладке. Откройте актуальное сохранение.");
    }
    const progress = replay(saved.history);
    if (format === "json") {
      const body = JSON.stringify({ ...saved, snapshot: snapshotOf(progress) }, null, 2);
      saveDownload(exportName(saved, "json"), body, "application/json");
    } else {
      saveDownload(exportName(saved, "txt"), textReport(saved, progress), "text/plain;charset=utf-8");
    }
  }

  async function run(action) {
    if (view.busy) return;
    setBusy(true);
    try {
      await action();
    } catch (error) {
      announce(error?.message || "Действие не удалось. Попробуйте снова.", "warning");
    } finally {
      setBusy(false);
    }
  }

  const controls = {
    enter: enterTeam,
    "choose-team": () => {
      const heading = root.querySelector("#pv-team-title");
      heading.focus({ preventScroll: true });
      heading.scrollIntoView({ block: "start", behavior: "instant" });
    },
    home: async () => { await noteWrites; showHome(); },
    materials: openMaterials,
    "close-materials": () => ui.materials.close(),
    dossier: openDossier,
    commit: () => commit(),
    default: () => commit(true),
    next: nextRound,
    reset: resetTeam,
    import: () => ui.file.click(),
    "export-json": () => download("json"),
    "export-txt": () => download("txt")
  };

  root.addEventListener("click", (event) => {
    const button = event.target.closest("button[data-action]");
    if (!button || button.disabled || !Object.hasOwn(controls, button.dataset.action)) return;
    void run(() => controls[button.dataset.action](button.dataset.value));
  });

  root.addEventListener("change", (event) => {
    const input = event.target;
    if (input.name === "pv-team") {
      view.team = Number(input.value);
      root.querySelector("#pv-enter-label").textContent = enterLabel(slotFor(view.team));
      return;
    }
    if (input.name === "pv-choice") {
      const button = root.querySelector("#pv-commit-button");
      if (!button) return;
      const round = ROUNDS[view.record.history.length];
      const option = getOptions(round, view.progress).find((item) => item.id === input.value && !item.blocked);
      if (!option) return;
      view.choice = option.id;
      button.disabled = false;
      root.querySelector("#pv-choice-hint").textContent = choiceHint(option, view.progress.tokens);
      return;
    }
    if (input === ui.file) {
      const file = input.files[0];
      input.value = "";
      if (file) void run(() => importFile(file));
    }
  });

  root.addEventListener("input", (event) => {
    if (event.target.matches("textarea[data-note]")) queueNote(event.target);
  });

  window.addEventListener("storage", (event) => {
    if (!storageAvailable) return;
    if (event.key !== null && !CONFIG.TEAMS.some((team) => keyFor(team) === event.key)) return;
    const current = view.record;
    if (!current) {
      render();
      return;
    }
    if (event.key !== null && event.key !== keyFor(current.team)) return;
    const latest = slotFor(current.team).record;
    if (!latest) {
      showHome("Сохранение команды очищено в другой вкладке.", null);
    } else if (latest.revision !== current.revision || latest.session !== current.session) {
      showRecord(latest, "Открыто актуальное состояние из другой вкладки.", { focus: null });
    }
  });

  const lastTeam = activeTab();
  if (CONFIG.TEAMS.includes(lastTeam)) {
    const saved = slotFor(lastTeam).record;
    if (saved) showRecord(saved, "", { focus: null });
    else { view.team = lastTeam; showHome("", null); }
  } else {
    render();
  }
})();
</script>
